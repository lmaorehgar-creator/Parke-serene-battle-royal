<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Street Brawl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3efe6;--ink:#1d1b1a;--card:#fff;--line:#cfc7b8;--red:#c8321e;--box-sizing:border-box;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--ink:#f1ebdd;--card:#24201a;--line:#4a4235}}
:root[data-theme="dark"]{--bg:#15130f;--ink:#f1ebdd;--card:#24201a;--line:#4a4235}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100%;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-family:Impact,"Arial Black",sans-serif;letter-spacing:2px;font-size:30px;margin:10px 0 2px;color:var(--red);font-weight:400}
#wrap{position:relative;width:100%;max-width:720px;padding:0 8px}
canvas{width:100%;display:block;border:3px solid var(--ink);border-radius:6px;background:#222}
#sel{text-align:center;padding:6px 8px;width:100%;max-width:720px}
.cards{display:flex;gap:8px;justify-content:center}
.card{flex:1;max-width:210px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;font-size:12px;text-align:left}
.card:active{border-color:var(--red)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}
.card b{font-size:15px;display:block;margin-bottom:4px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:2px 0 5px}.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
button.m{font:inherit;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:9px 16px;margin:8px 4px;cursor:pointer}
#pad{display:none;position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
.dp{position:relative;width:170px;height:170px}.ac{position:relative;width:180px;height:170px}

#pad button{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 11px "Trebuchet MS",sans-serif;opacity:.88;pointer-events:auto;touch-action:none}
#pad button.big{width:78px;height:78px;font-size:14px}#pad button.big[data-k=p]{background:var(--red);color:#fff}
#pad button.on{background:var(--red);color:#fff}
@media (pointer:coarse){#pad.act{display:flex}body{padding-bottom:200px}}
p.h{font-size:12px;opacity:.75;margin:4px 8px}
</style></head><body>
<h1>STREET BRAWL</h1>
<div id="sel"><div style="margin-bottom:6px">Tap a fighter to start the fight. Stats are random.</div>
<div class="cards" id="cards"></div><button class="m" id="reroll">Re-roll stats</button>

<p class="h">Keys: arrows or A/D move, W jump, J punch, K kick, S block. On a phone, use the pad.</p></div>
<div id="wrap" style="display:none"><canvas id="c" width="640" height="360"></canvas></div>
<div id="pad"><div class="dp"><button data-k="j" style="left:57px;top:0">Jump</button><button data-k="l" style="left:0;top:57px">&#9664;</button><button data-k="r" style="left:114px;top:57px">&#9654;</button><button data-k="b" style="left:57px;top:114px">Block</button></div><div class="ac"><button class="big" data-k="k" style="right:92px;top:0">Kick</button><button class="big" data-k="p" style="right:0;top:70px">Punch</button></div></div>
<button class="m" id="back" style="display:none">Change fighter</button>

draw();}catch(err){showErr(err)}}
function body(f){const x=f.x,y=f.y,s=f.face,a=f.atk;
g.fillStyle="rgba(0,0,0,.3)";g.beginPath();g.ellipse(x,GY+4,28,6,0,0,7);g.fill();

g.strokeStyle="#2a2018";g.lineWidth=11;g.lineCap="round";
const step=Math.abs(f.vx)>.5&&f.y>=GY?Math.sin(frame*.4)*8:0;
g.beginPath();g.moveTo(x-6,y-40);g.lineTo(x-8+step,y);g.moveTo(x+6,y-40);g.lineTo(x+8-step,y);
if(a&&a.name==="k"&&f.t>=a.act-3&&f.t<=a.act+8){g.moveTo(x+6*s,y-40);g.lineTo(x+(a.reach)*s,y-48)}g.stroke();
g.strokeStyle=f.c.col;g.lineWidth=26;g.beginPath();g.moveTo(x,y-44);g.lineTo(x,y-82);g.stroke();
g.strokeStyle="#e0b48c";g.lineWidth=8;g.beginPath();
if(f.blk){g.moveTo(x,y-76);g.lineTo(x+16*s,y-92);g.moveTo(x,y-70);g.lineTo(x+18*s,y-82)}
else if(a&&a.name==="p"&&f.t>=a.act-3&&f.t<=a.act+6){g.moveTo(x,y-76);g.lineTo(x+(a.reach-8)*s,y-78);g.moveTo(x,y-70);g.lineTo(x-14*s,y-60)}
else{g.moveTo(x,y-76);g.lineTo(x+14*s,y-62);g.moveTo(x,y-76);g.lineTo(x-12*s,y-62)}g.stroke();
g.save();g.beginPath();g.arc(x,y-108,24,0,7);g.clip();g.drawImage(f.c.im,x-24,y-132,48,48);g.restore();
g.strokeStyle="#2a2018";g.lineWidth=3;g.beginPath();g.arc(x,y-108,24,0,7);g.stroke();
if(f.spark>0){f.spark--;g.fillStyle="#ffd23f";g.beginPath();g.arc(x+(f.face)*60,y-80,10+f.spark,0,7);g.fill()}
g.restore()}
function bar(f,x,w,right){g.fillStyle="#000";g.fillRect(x,14,w,16);g.fillStyle="#e6c229";
const ww=w*f.hp/f.max;g.fillRect(right?x+w-ww:x,14,ww,16);g.strokeStyle="#fff";g.lineWidth=2;g.strokeRect(x,14,w,16);
g.fillStyle="#fff";g.font="bold 13px Verdana";g.textAlign=right?"right":"left";g.fillText(f.c.n,right?x+w:x,45)}
function draw(){
const gd=g.createLinearGradient(0,0,0,GY);gd.addColorStop(0,"#f08a4b");gd.addColorStop(1,"#5a2d52");g.fillStyle=gd;g.fillRect(0,0,W,H);
g.fillStyle="#2b1a33";for(let i=0;i<9;i++){const h=60+(i*37%70);g.fillRect(i*80,GY-h-10,60,h+10)}

function showErr(e){let d=document.getElementById('err');if(!d){d=document.createElement('pre');d.id='err';d.style.cssText='color:#c8321e;font-size:11px;white-space:pre-wrap;padding:6px';document.body.appendChild(d)}d.textContent='Error: '+(e&&e.message)}
window.onerror=(m)=>showErr({message:m});
let AC;function ctx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f1,f2,d,ty,v){const a=ctx();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),t=a.currentTime;o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(a.destination);o.start();o.stop(t+d)}
function noise(d,v){const a=ctx();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),gn=a.createGain();s.buffer=b;gn.gain.value=v;s.connect(gn);gn.connect(a.destination);s.start()}
function snd(t){try{({jump:()=>tone(300,700,.15,"square",.08),whoosh:()=>noise(.08,.12),punch:()=>{noise(.1,.4);tone(180,60,.12,"square",.2)},kick:()=>{noise(.14,.5);tone(130,40,.2,"sawtooth",.25)},block:()=>tone(900,500,.06,"square",.12),ko:()=>{tone(400,60,.8,"sawtooth",.25);noise(.4,.3)},fight:()=>{tone(220,440,.2,"square",.12);setTimeout(()=>tone(440,880,.25,"square",.12),180)}})[t]()}catch(e){}}
